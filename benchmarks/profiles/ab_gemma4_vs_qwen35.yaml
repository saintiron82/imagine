# A/B Comparison: Gemma 4 E4B vs Qwen3.5-9B
# Each model gets its own optimized settings for maximum performance.
# Both use the 2-Stage pipeline: Stage 1 (classify) → Stage 2 (type-specific concise prompt).
#
# Usage:
#   python tools/bench_worker_sim.py --profile benchmarks/profiles/ab_gemma4_vs_qwen35.yaml
#   python tools/bench_mc_quality.py --profile benchmarks/profiles/ab_gemma4_vs_qwen35.yaml

name: "A/B: Gemma 4 E4B vs Qwen3.5-9B"
description: "Head-to-head MC phase — 2-Stage pipeline with type-specific concise prompts"

ab:
  - "mlx-community/gemma-4-e4b-it-4bit"
  - "mlx-community/Qwen3.5-9B-MLX-4bit"
count: 10
max_edge: 768

# ── Per-model tuning ──────────────────────────────────────────────
# Available keys: concise, max_tokens, temperature, system_prompt, stage2_prompt

model_a_opts:
  # Gemma 4 E4B: 4.5B effective — concise + type-specific prompt via pipeline
  concise: true
  max_tokens: 300
  temperature: 0.1
  system_prompt: >-
    You are an image analysis assistant. Output valid JSON only.
    No explanation, no markdown fences, no thinking.

model_b_opts:
  # Qwen3.5-9B: production model — concise + type-specific prompt via pipeline
  concise: true
  max_tokens: 512
  temperature: 0.1
