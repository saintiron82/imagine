version: 1
project:
  name: Imagine
  tracker_type: pair
  tracker_project: IMGV2
  trunk_branch: main
  integration_branch: feat/app-v2
  preferred_card_language: ko

guide_files:
  - CLAUDE.md
  - docs/nas_processing_flow.md

protected_contracts:
  - "/api/v1 응답 스키마 (backend/server/routers/* — 프런트 단독 패키지에서 변경 금지)"
  - "하드 인증 게이트 (미로그인 상태에서 어떤 화면도 렌더 금지)"
  - "preload IPC 표면 (window.imagineDesktop 채널 집합 — preload.cjs/main.cjs 동시 조정 필요)"
  - "i18n 키 패리티 (en-US.json ↔ ko-KR.json 완전 일치 유지)"
  - "SQLite 쓰기 규칙 (DML 후 무조건 commit/rollback, 조건부 commit 금지)"
  - "file_tasks phase status 상태 모델 (download/parse/mc/vv/mv)"

classification:
  runtime_roots:
    - frontend-v2/src
    - frontend-v2/electron
    - frontend/src
    - homepage/src
    - backend
  test_markers:
    - test
    - tests
    - fixtures
  docs_markers:
    - docs
    - readme
    - samples
    - mockups
  migration_markers:
    - migration
    - migrations
  deploy_markers:
    - deploy
    - docker
    - compose
    - .env
    - config
    - infra
    - scripts
  contract_markers:
    - api
    - route
    - routers
    - schema
    - contract

package_policy:
  express_lane_max_changed_loc: 30
  max_package_changed_loc: 400

validation:
  frontend_v2:
    - "cd frontend-v2 && npm run lint"
    - "cd frontend-v2 && npm run build"
  backend:
    - "python -m pytest tests/ -x -q"

audit:
  package_audit: code-review
  final_audit: merge-gate

rollback:
  method: "패키지=커밋 1~n개(feat/app-v2 위 직렬), git revert 단위 복구"
