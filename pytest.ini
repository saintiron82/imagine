[pytest]
# 수집 범위를 tests/ 로 고정한다.
#
# 이게 없으면 저장소 루트에서 `pytest` 를 그냥 돌렸을 때 42개 수집 오류가 났다 —
# 루트에 흩어져 있던 낡은 스크래치 스크립트(모듈 레벨 assert 로 즉시 실패)와,
# 빌드 산출물 안에 통째로 들어있는 서드파티 테스트
# (frontend/dist-electron/.../_internal/torch/testing/...) 까지 훑었기 때문이다.
# CI 는 `pytest tests/` 를 명시하므로 무사했지만, 로컬에서 맨손으로 돌리면 깨졌다.
testpaths = tests

# 빌드 산출물·가상환경·의존성 트리는 절대 훑지 않는다.
norecursedirs =
    .git .venv venv node_modules
    build dist dist-win dist-electron
    frontend/dist frontend/dist-electron frontend-v2/dist frontend-v2/dist-electron
    output output_mock thumbnails benchmarks
